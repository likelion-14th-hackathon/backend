llm:
  openai:
    api-key: ${OPENAI_API_KEY:}
    fast-model: gpt-4o-mini
    reasoning-model: gpt-5.5

server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:likelion14th_hackathon}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

jwt:
  secret: ${JWT_SECRET:sfj-9f3a2c7e4b8d1f6a0c5e7d9b2a4f8e1c}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}